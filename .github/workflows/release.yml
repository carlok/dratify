name: release

# Publishing is tokenless. Both registries verify a short-lived OIDC identity
# token minted by GitHub for this specific workflow, so there is no long-lived
# secret in this repository to leak.
#
#   PyPI       Trusted Publishing. Works for the first release too, via a
#              "pending publisher" configured before the name exists.
#   crates.io  Trusted Publishing, but only AFTER one manual `cargo publish`
#              -- the configuration cannot be created for a crate that has
#              never been published.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # mint the OIDC token PyPI verifies
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  crates:
    needs: build
    runs-on: ubuntu-latest
    environment: crates
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
