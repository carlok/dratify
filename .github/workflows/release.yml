name: release

# Publishing is tokenless. Both registries verify a short-lived OIDC identity
# token minted by GitHub for this specific workflow, so there is no long-lived
# secret in this repository to leak.
#
#   PyPI       Trusted Publishing. Works for the first release too, via a
#              "pending publisher" configured before the name exists.
#   crates.io  Trusted Publishing, but only AFTER one manual `cargo publish`
#              -- the configuration cannot be created for a crate that has
#              never been published.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install build twine
      # ci.yml triggers on branches and pull requests, not on tags, so
      # without this nothing tests the ref being published.
      - run: PYTHONPATH=src python -m unittest discover -s tests
      - run: python -m build
      - run: twine check dist/*
      - name: the tag must name the version being built
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          BUILT=$(ls dist/*.tar.gz | sed -E 's/.*-([0-9][^-]*)\.tar\.gz/\1/')
          echo "tag=$TAG built=$BUILT"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$TAG" != "$BUILT" ]; then
            echo "::error::tagged $TAG but built $BUILT -- the version was not "\
                 "bumped. skip-existing would then publish nothing and report "\
                 "success."
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # mint the OIDC token PyPI verifies
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          # Re-running a release must not be an error. The crates job has the
          # same property via an explicit version check; this is PyPI's
          # built-in equivalent.
          skip-existing: true

  crates:
    needs: build
    runs-on: ubuntu-latest
    environment: crates
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      # The first release of this crate was published by hand, because
      # crates.io will not let you configure a trusted publisher for a crate
      # that has never been published. So this job has to tolerate finding the
      # version already there -- and that guard is worth keeping regardless,
      # since re-running a release should not be an error.
      - name: Is this version already on crates.io?
        id: check
        run: |
          V=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if curl -sfH 'User-Agent: dratify-release (github.com/carlok/dratify)' \
               "https://crates.io/api/v1/crates/dratify/$V" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::dratify $V is already on crates.io; skipping publish"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1
        if: steps.check.outputs.exists == 'false'
        id: auth
      - run: cargo publish
        if: steps.check.outputs.exists == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
