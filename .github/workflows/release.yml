name: release

# Publishing is tokenless. Both registries verify a short-lived OIDC identity
# token minted by GitHub for this specific workflow, so there is no long-lived
# secret in this repository to leak.
#
#   PyPI       Trusted Publishing. Works for the first release too, via a
#              "pending publisher" configured before the name exists.
#   crates.io  Trusted Publishing, but only AFTER one manual `cargo publish`
#              -- the configuration cannot be created for a crate that has
#              never been published.

# Tags only. A `workflow_dispatch` trigger used to sit here for the very first
# publish. It ran this file *from whichever branch was selected*, so a branch
# could publish under any version it declared, or simply delete the check
# below. The deploy environments are also restricted to `v*` tags in the
# repository settings: that is the one control a branch cannot edit.
#
# To retry a failed publish, use "Re-run failed jobs" on the tag's run, which
# keeps the tag ref. See docs/RELEASING.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install build twine
      # ci.yml triggers on branches and pull requests, not on tags, so
      # without this nothing tests the ref being published.
      - run: PYTHONPATH=src python -m unittest discover -s tests
      - run: python -m build
      - run: twine check dist/*
      - name: only a tag may publish, and it must name the version being built
        run: |
          # Unconditional. This used to apply only `if` the ref was a tag, so
          # any other way of starting the workflow skipped it entirely.
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::releases come from v* tags only, not from" \
                 "$GITHUB_REF_TYPE '$GITHUB_REF_NAME'"
            exit 1
          fi
          TAG="${GITHUB_REF_NAME#v}"
          BUILT=$(ls dist/*.tar.gz | sed -E 's/.*-([0-9][^-]*)\.tar\.gz/\1/')
          echo "tag=$TAG built=$BUILT"
          if [ "$TAG" != "$BUILT" ]; then
            echo "::error::tagged $TAG but built $BUILT -- the version was not "\
                 "bumped. skip-existing would then publish nothing and report "\
                 "success."
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  # ci.yml does not run on tags and `cargo publish` only compiles, so without
  # this nothing tests the crate being published. Both publish jobs wait for
  # it: a crate that fails here must not follow a PyPI upload of the same
  # version, which is half a release.
  rust-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - run: cargo test --release --locked

  pypi:
    needs: [build, rust-test]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # mint the OIDC token PyPI verifies
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          # Re-running a release must not be an error. The crates job has the
          # same property via an explicit version check; this is PyPI's
          # built-in equivalent.
          skip-existing: true

  crates:
    needs: [build, rust-test]
    runs-on: ubuntu-latest
    environment: crates
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      # The first release of this crate was published by hand, because
      # crates.io will not let you configure a trusted publisher for a crate
      # that has never been published. So this job has to tolerate finding the
      # version already there -- and that guard is worth keeping regardless,
      # since re-running a release should not be an error.
      - name: Is this version already on crates.io?
        id: check
        run: |
          V=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if curl -sfH 'User-Agent: dratify-release (github.com/carlok/dratify)' \
               "https://crates.io/api/v1/crates/dratify/$V" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::dratify $V is already on crates.io; skipping publish"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1
        if: steps.check.outputs.exists == 'false'
        id: auth
      - run: cargo publish
        if: steps.check.outputs.exists == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # A GitHub Release per tag, with that version's CHANGELOG section as its
  # notes. Last, so a release only appears once both registries have it. The
  # one job with write access, and only to create the release.
  github-release:
    needs: [pypi, crates]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: release notes from CHANGELOG.md
        run: |
          V="${GITHUB_REF_NAME#v}"
          awk -v h="## [$V]" 'index($0, h) == 1 {on = 1; next} on && /^## \[/ {exit} on' \
            CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no section for $V"
            exit 1
          fi
      - name: create it, unless a re-run finds it there
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::notice::release $GITHUB_REF_NAME already exists"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag \
              --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          fi
