name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      # no pip install: the package has zero dependencies and that is the
      # property under test as much as the checker itself
      - run: PYTHONPATH=src python -m unittest discover -s tests -v

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # no pip install: the coverage tool uses the standard library's trace
      # module, so the zero-dependency promise holds for the checks too
      - run: python tests/coverage_report.py

  # The claim in README, SECURITY.md and both Rust docs is that the two
  # implementations are differentially tested against each other. That was not
  # true of anything that ran: the comparisons were behind skip guards that
  # could never be satisfied here. This job is what makes the claim checkable,
  # so it must not be allowed to skip silently -- the last step fails if it did.
  differential:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # cdclkit-native embeds the same Rust crate and exposes check_proof.
      # Installing just the compiled module keeps this out of a release cycle
      # with cdclkit, which depends on this package.
      - run: pip install cdclkit-native
      - name: the two checkers must agree
        run: |
          PYTHONPATH=src python -m unittest tests.test_differential -v 2>&1 | tee /tmp/diff.log
          grep -q "^OK" /tmp/diff.log
          if grep -qE "skipped|no native checker" /tmp/diff.log; then
            echo "::error::the differential tests skipped -- the agreement claim is untested"
            exit 1
          fi

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy
      - run: cargo test --release
      - run: cargo clippy --all-targets -- -D warnings

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      # install the built wheel into a clean env and use it from outside the
      # checkout -- testing the repository is not testing the artefact
      - run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          cd /tmp && /tmp/smoke/bin/python -c "
          import dratify
          f = dratify.parse_dimacs('p cnf 2 4\n1 2 0\n1 -2 0\n-1 2 0\n-1 -2 0\n')
          assert dratify.check_proof(f, '1 0\n0\n').ok
          assert not dratify.check_proof(f, '1 0\n').ok
          print('smoke ok')"
