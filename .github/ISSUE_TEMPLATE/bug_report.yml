name: Bug report
description: Wrong verdict, crash, hang, or other defect in proof checking
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For security issues, see [SECURITY.md](https://github.com/carlok/dratify/blob/main/SECURITY.md) and report privately — do not use a public issue.

        If you can, attach a small DIMACS file and DRAT/DRUP proof, or a minimal Python snippet that reproduces the problem.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what did you get instead? Include `result.ok`, `result.reached_empty`, and `result.reason` if you have them.
      placeholder: e.g. satisfiable formula accepted with ok=True
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Commands, version, and engine if relevant (`python` vs `native`).
      placeholder: |
        python3 -c "import dratify; print(dratify.__version__)"
        PYTHONPATH=src python3 -c "..."
    validations:
      required: true

  - type: dropdown
    id: engine
    attributes:
      label: Engine
      options:
        - Python (default)
        - Native (Rust via register_native)
        - auto
        - Not sure
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: dratify version
      placeholder: e.g. 0.1.7 or git commit
    validations:
      required: false