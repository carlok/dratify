[build-system]
# 77 is the first release that understands the PEP 639 `license`
# expression and `license-files` below.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dratify"
version = "0.1.4"
description = "Check DRAT/DRUP proofs of unsatisfiability inside your Python process. Zero dependencies, optional Rust accelerator."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Carlo Perassi" }]
keywords = ["sat", "drat", "drup", "proof", "checker", "unsatisfiability", "rup", "rat"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Testing",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/carlok/dratify"
Source = "https://github.com/carlok/dratify"
Issues = "https://github.com/carlok/dratify/issues"
Changelog = "https://github.com/carlok/dratify/blob/main/CHANGELOG.md"
Security = "https://github.com/carlok/dratify/blob/main/SECURITY.md"
Documentation = "https://github.com/carlok/dratify/blob/main/README.md"

[tool.setuptools.packages.find]
where = ["src"]

# PEP 561, so the annotations in the source are actually usable downstream.
[tool.setuptools.package-data]
dratify = ["py.typed"]
